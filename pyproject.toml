[project]
name = "nadhir"
version = "0.1.0"
description = "Nadhir Hindcast MVP: real-data hindcast of HAB early warning at UAE desalination intakes"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "xarray==2024.11.0",
  "netCDF4==1.7.2",
  "h5netcdf==1.4.1",
  "h5py==3.12.1",
  "pyyaml==6.0.2",
  "requests==2.32.3",
  "matplotlib==3.9.3",
  "scipy==1.14.1",
]
[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
